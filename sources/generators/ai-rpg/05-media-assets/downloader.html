let dirHandle = null, stopped = false, saved = {};
const $ = id => document.getElementById(id);
const listEl = $("list"), barEl = $("bar").firstElementChild, statusEl = $("status");
listEl.innerHTML = FILES.map((f,i) => '<div class="row"><span class="cat">' + f.c + '</span><span class="title">' + f.t.replace(/</g,"&lt;") + '</span><span class="url">' + f.d + '</span><span data-s="' + i + '">-</span></div>').join("");
const mark = (i, v) => { const el = listEl.querySelector('[data-s="' + i + '"]'); if (el) el.textContent = v; };
async function writeToDir(path, blob) {
  const parts = path.split("/"); let dir = dirHandle;
  for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i], { create: true });
  const fh = await dir.getFileHandle(parts[parts.length - 1], { create: true });
  const w = await fh.createWritable(); await w.write(blob); await w.close();
}
$("pick").onclick = async () => { try { dirHandle = await window.showDirectoryPicker({ mode: "readwrite" }); $("all").disabled = false; statusEl.textContent = "folder selected"; } catch (e) { statusEl.textContent = "cancelled"; } };
$("stop").onclick = () => { stopped = true; };
$("all").onclick = async () => {
  stopped = false; $("all").disabled = true; let done = 0, bytes = 0;
  for (let i = 0; i < FILES.length; i++) {
    if (stopped) break;
    const f = FILES[i];
    try {
      const res = await fetch(f.u); if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob(); bytes += blob.size;
      if (dirHandle) await writeToDir(f.d, blob);
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = f.d.split("/").pop(); document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 500)); }
      mark(i, "ok");
    } catch (e) { mark(i, "FAIL"); }
    done++; barEl.style.width = (done / FILES.length * 100).toFixed(1) + "%";
    statusEl.textContent = done + "/" + FILES.length + " (" + (bytes/1048576).toFixed(1) + " MB)";
  }
  $("all").disabled = false; statusEl.textContent = stopped ? "stopped" : "done";
};
