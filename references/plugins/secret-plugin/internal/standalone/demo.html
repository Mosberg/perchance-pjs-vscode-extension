<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secret-plugin standalone demo</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
  textarea { width: 100%; min-height: 6rem; font: inherit; }
  .k { word-break: break-all; font-size: 80%; line-height: 1.35; }
  pre { background: #f0f0f0; padding: .75rem; border-radius: 4px; word-break: break-all; white-space: pre-wrap; }
  .ok { color: #0a7a2f; } .bad { color: #b00020; }
  @media (prefers-color-scheme: dark) { body { background:#111; color:#ddd; } pre { background:#242424; } }
</style>
</head>
<body>
<h2>secret-plugin — standalone round-trip</h2>
<p>Uses only <code>./secret-plugin.mjs</code> (ML-KEM-768 + HKDF-SHA256 + AES-256-GCM + gzip).</p>
<p><button id="runBtn">Generate keys + round-trip</button></p>
<p>Plaintext: <textarea id="plainInput">The text we are going to encrypt.</textarea></p>
<p>Result: <span id="resultEl">—</span></p>
<pre id="outEl"></pre>
<script type="module">
import secretPlugin from "./secret-plugin.mjs";
runBtn.onclick = () => {
  const plain = plainInput.value;
  const t0 = performance.now();
  const keys = secretPlugin.generateKeyPair();
  const t1 = performance.now();
  const enc = secretPlugin.encrypt(plain, keys.public);
  const t2 = performance.now();
  const dec = secretPlugin.decrypt(enc, keys.private);
  const t3 = performance.now();
  const ok = dec === plain;
  resultEl.textContent = ok ? "SUCCESS — decrypted text is identical" : "FAILURE";
  resultEl.className = ok ? "ok" : "bad";
  outEl.textContent = JSON.stringify({
    keygenMs: +(t1-t0).toFixed(1), encryptMs: +(t2-t1).toFixed(1), decryptMs: +(t3-t2).toFixed(1),
    publicKey: keys.public, privateKey: keys.private,
    encrypted: enc, encryptedLength: enc.length, decrypted: dec, success: ok
  }, null, 2);
};
</script>
</body>
</html>
